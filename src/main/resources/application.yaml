spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: sistema
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  cache:
    type: redis

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: ${DATABASE_DRIVER_CLASS_NAME}
  jpa:
    hibernate:
        ddl-auto: create
    properties:
      hibernate:
        dialect: ${DATABASE_DIALECT}
  security:
    jwt:
      secretKey: ${JWT_SECRET_KEY}
      expiration: ${JWT_EXPIRATION_TIME}
      refresh-expiration: ${JWT_REFRESH_TOKEN_TIME}
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            scope:
              - email
              - public_profile
        provider:
            facebook:
              user-info-uri: ${FACEBOOK_USER_INFO_URI}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          conectiontimeout: 5000
          timeout: 5000
  servlet:
    multipart:
      max-file-size: 5MB


