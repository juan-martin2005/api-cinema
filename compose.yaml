services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cinema_dev
      POSTGRES_USER: ${DATABASE_USERNAME:-cinema}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local-development-only}
    ports: ["127.0.0.1:15432:5432"]
    volumes: [cinema_dev_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16379:6379"]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:11025:1025", "127.0.0.1:18025:8025"]
volumes:
  cinema_dev_data:
